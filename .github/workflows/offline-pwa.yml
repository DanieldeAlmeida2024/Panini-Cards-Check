name: Panini - instalacao PWA e primeiro uso offline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    name: PWA em build de produção - Chromium offline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar app e navegador de teste
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts "playwright@1.56.1"
          npx playwright install --with-deps chromium
      - name: Gerar build estático do Vite
        run: npm run build
      - name: Servir build local (sem hospedagem externa)
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/pwa.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pwa.log
          exit 1
      - name: Testar instalacao cacheada e recarga totalmente offline
        run: PANINI_BASE_URL=http://127.0.0.1:4174 node --test tests/offline-pwa.test.mjs
